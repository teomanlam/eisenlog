<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EISEN LOG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#141414;
      --panel:#1e1e1e;
      --panel-2:#252525;
      --line:#333333;
      --text:#f2f0ea;
      --muted:#8c8c88;
      --plate-red:#c1272d;
      --plate-blue:#1f5fa8;
      --plate-yellow:#d9a520;
      --plate-green:#2e8b57;
    }
    *{box-sizing:border-box;}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:'Inter',sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    .wrap{
      max-width:520px;
      margin:0 auto;
      padding:24px 18px 80px;
    }
    header{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      margin-bottom:22px;
      border-bottom:3px solid var(--plate-red);
      padding-bottom:14px;
    }
    h1{
      font-family:'Oswald',sans-serif;
      font-weight:700;
      font-size:28px;
      letter-spacing:1px;
      margin:0;
      text-transform:uppercase;
    }
    h1 span{ color:var(--plate-red); }
    .tagline{
      font-size:11px;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:1.5px;
    }

    .card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:6px;
      padding:16px;
      margin-bottom:16px;
    }
    .form-row{
      display:flex;
      gap:8px;
      margin-bottom:10px;
    }
    .form-row.full{ flex-direction:column; }
    label{
      font-size:10px;
      text-transform:uppercase;
      letter-spacing:1px;
      color:var(--muted);
      margin-bottom:4px;
      display:block;
    }
    select, input{
      width:100%;
      background:var(--panel-2);
      border:1px solid var(--line);
      color:var(--text);
      padding:10px 8px;
      border-radius:4px;
      font-family:'IBM Plex Mono',monospace;
      font-size:15px;
    }
    select:focus, input:focus{
      outline:none;
      border-color:var(--plate-red);
    }
    .grid3{
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:8px;
    }
    button{
      width:100%;
      background:var(--plate-red);
      color:#fff;
      border:none;
      padding:13px;
      border-radius:4px;
      font-family:'Oswald',sans-serif;
      font-weight:600;
      font-size:15px;
      letter-spacing:1px;
      text-transform:uppercase;
      cursor:pointer;
      margin-top:4px;
      transition:transform .08s ease, background .15s ease;
    }
    button:active{ transform:scale(0.98); }
    button:hover{ background:#a5222a; }
    .secondary-btn{
      width:auto;
      min-width:130px;
      background:var(--panel-2);
      border:1px solid var(--line);
      color:var(--text);
      padding:10px 12px;
      margin-top:0;
      font-size:12px;
      letter-spacing:0.6px;
    }
    .secondary-btn:hover{ background:#2d2d2d; }
    .new-ex-toggle{
      background:none;
      color:var(--muted);
      font-family:'Inter',sans-serif;
      font-weight:400;
      font-size:12px;
      text-transform:none;
      letter-spacing:0;
      padding:4px 0;
      margin:0 0 8px 0;
      width:auto;
      text-decoration:underline;
    }
    .new-ex-toggle:hover{ background:none; color:var(--text); }
    .inline-add{
      display:flex;
      gap:8px;
      align-items:center;
    }
    .exercise-list{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:8px;
    }
    .exercise-pill{
      display:flex;
      align-items:center;
      gap:8px;
      background:var(--panel-2);
      border:1px solid var(--line);
      color:var(--text);
      border-radius:999px;
      padding:7px 10px 7px 12px;
      font-family:'IBM Plex Mono',monospace;
      font-size:12px;
    }
    .exercise-pill button{
      width:18px;
      height:18px;
      min-width:18px;
      border-radius:50%;
      padding:0;
      margin:0;
      background:var(--plate-red);
      color:#fff;
      font-size:12px;
      line-height:1;
    }

    .pb-flash{
      display:none;
      background:var(--plate-yellow);
      color:#141414;
      font-family:'Oswald',sans-serif;
      font-weight:600;
      text-align:center;
      padding:10px;
      border-radius:4px;
      margin-bottom:16px;
      letter-spacing:1px;
      text-transform:uppercase;
      font-size:13px;
    }

    .ex-card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:6px;
      margin-bottom:12px;
      overflow:hidden;
    }
    .ex-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:14px 16px;
      cursor:pointer;
    }
    .ex-name{
      font-family:'Oswald',sans-serif;
      font-size:16px;
      font-weight:600;
      letter-spacing:.5px;
      text-transform:uppercase;
    }
    .ex-pb{
      text-align:right;
    }
    .ex-pb .pb-val{
      font-family:'IBM Plex Mono',monospace;
      font-size:20px;
      font-weight:600;
      color:var(--plate-yellow);
    }
    .ex-pb .unit{
      font-size:11px;
      color:var(--muted);
      margin-left:3px;
    }
    .ex-pb .vol-val{
      font-family:'IBM Plex Mono',monospace;
      font-size:11px;
      color:var(--plate-blue);
      margin-top:2px;
    }
    .ex-sub{
      font-size:11px;
      color:var(--muted);
      padding:0 16px 12px;
      margin-top:-8px;
    }
    .history{
      display:none;
      border-top:1px solid var(--line);
      padding:10px 16px 14px;
    }
    .history.open{ display:block; }
    .sess-group{ margin-bottom:10px; }
    .sess-group:last-child{ margin-bottom:0; }
    .sess-head{
      display:flex;
      justify-content:space-between;
      font-family:'IBM Plex Mono',monospace;
      font-size:11px;
      color:var(--plate-blue);
      text-transform:uppercase;
      letter-spacing:.5px;
      padding:4px 0;
      border-bottom:1px solid #2a2a2a;
      margin-bottom:2px;
    }
    .hist-row{
      display:flex;
      justify-content:space-between;
      font-family:'IBM Plex Mono',monospace;
      font-size:12.5px;
      padding:5px 0 5px 10px;
      color:var(--muted);
      border-bottom:1px solid #262626;
    }
    .sess-group .hist-row:last-child{ border-bottom:none; }
    .hist-row.is-pb{ color:var(--plate-yellow); }
    .hist-row .del{
      color:#555;
      cursor:pointer;
      padding-left:8px;
    }
    .hist-row .del:hover{ color:var(--plate-red); }

    .empty{
      text-align:center;
      color:var(--muted);
      font-size:13px;
      padding:30px 10px;
    }
    .plate-dot{
      display:inline-block;
      width:7px;height:7px;
      border-radius:50%;
      margin-right:5px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>EISEN<span>LOG</span></h1>
        <div class="tagline">Gewicht &middot; Sätze &middot; Wiederholungen</div>
      </div>
    </header>

    <div class="pb-flash" id="pbFlash">🏆 Neuer Personal Best!</div>

    <div class="card">
      <div class="form-row full">
        <label>Übung</label>
        <select id="exSelect"></select>
      </div>
      <div class="grid3">
        <div>
          <label>Gewicht (kg)</label>
          <input type="number" id="weightInput" step="2.5" placeholder="100" />
        </div>
        <div>
          <label>Sätze</label>
          <input type="number" id="setsInput" step="1" value="5" />
        </div>
        <div>
          <label>Wdh.</label>
          <input type="number" id="repsInput" step="1" value="3" />
        </div>
      </div>
      <button type="button" id="addBtn">Eintragen</button>
      <div style="margin-top:12px;">
        <a href="./exercises.html" style="color:var(--text); text-decoration:none; display:inline-block; width:100%; text-align:center; border:1px solid var(--line); border-radius:4px; padding:10px 12px; background:var(--panel-2);">Übungen verwalten</a>
      </div>
    </div>

    <div id="exList"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="./cloudflare-config.js"></script>
  <script src="./firebase-config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
