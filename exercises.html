<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EISEN LOG – Übungen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#141414;
      --panel:#1e1e1e;
      --panel-2:#252525;
      --line:#333333;
      --text:#f2f0ea;
      --muted:#8c8c88;
      --plate-red:#c1272d;
      --plate-blue:#1f5fa8;
      --plate-yellow:#d9a520;
      --plate-green:#2e8b57;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
    .wrap{max-width:520px;margin:0 auto;padding:24px 18px 80px;}
    header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;border-bottom:3px solid var(--plate-red);padding-bottom:14px;}
    h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:28px;letter-spacing:1px;margin:0;text-transform:uppercase;}
    h1 span{color:var(--plate-red);}
    .tagline{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px;}
    label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:4px;display:block;}
    input, button{font-family:'IBM Plex Mono',monospace;}
    input{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:10px 8px;border-radius:4px;}
    button{width:100%;background:var(--plate-red);color:#fff;border:none;padding:12px;border-radius:4px;font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;}
    .nav{display:flex;gap:8px;margin-top:10px;}
    .nav a{display:block;flex:1;text-align:center;padding:10px 12px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:12px;}
    .exercise-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
    .exercise-pill{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:7px 10px 7px 12px;font-family:'IBM Plex Mono',monospace;font-size:12px;}
    .exercise-pill button{width:18px;height:18px;min-width:18px;border-radius:50%;padding:0;margin:0;background:var(--plate-red);color:#fff;font-size:12px;line-height:1;}
    .empty{text-align:center;color:var(--muted);font-size:13px;padding:20px 10px;}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>EISEN<span>LOG</span></h1>
        <div class="tagline">Übungen verwalten</div>
      </div>
    </header>

    <div class="card">
      <label>Neue Übung</label>
      <input type="text" id="exerciseNameInput" placeholder="z. B. Langhantelrudern" />
      <div class="nav">
        <button type="button" id="addExerciseBtn">Hinzufügen</button>
      </div>
    </div>

    <div class="card">
      <label>Vorhandene Übungen</label>
      <div id="exerciseList" class="exercise-list"></div>
    </div>

    <div class="nav">
      <a href="./">Zurück zum Log</a>
    </div>
  </div>

  <script src="./cloudflare-config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
